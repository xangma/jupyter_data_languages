[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icg-phd-python"
version = "2026.1"
description = "Scientific Python, Git and coding-agent practicals for incoming ICG PhD students"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "astropy>=7,<9", "matplotlib>=3.9,<4", "pytest>=8,<10"]

[project.optional-dependencies]
teaching = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]
hub = ["jupyterhub==5.4.6", "nbgitpuller==1.3.0"]

[tool.setuptools.packages.find]
include = ["course2026*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
