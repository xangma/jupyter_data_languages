<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0.00 0.00 770.00 160.00" role="img" aria-labelledby="git-branches-title git-branches-desc">
  <title id="git-branches-title">Competing edits pause for conflict resolution</title>
  <desc id="git-branches-desc">From base C, branch A ('in degrees') and branch B ('shortest arc') edit the same line, pausing at a conflict until resolved and committed together as M ('degrees + shortest arc').</desc>
