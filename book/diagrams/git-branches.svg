      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M414.85,-54.48C454.78,-54.48 505.32,-54.48 549.65,-54.48" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="549.46,-57.28 557.46,-54.48 549.46,-51.68 549.46,-57.28" />
