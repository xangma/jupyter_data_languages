      <text xml:space="preserve" text-anchor="start" x="105.05" y="-90.23" font-family="Arial" font-weight="bold" font-size="15.00" fill="#14263c">A · description-a</text>
      <text xml:space="preserve" text-anchor="start" x="106.18" y="-75.23" font-family="Arial" font-size="15.00" fill="#14263c">    </text>
      <text xml:space="preserve" text-anchor="start" x="124.18" y="-75.23" font-family="Arial" font-size="13.00" fill="#526780">"in degrees"</text>
