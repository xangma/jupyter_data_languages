    <g id="node5" class="node">
      <title>merge</title>
      <path fill="#e9f7f2" stroke="#bac7d5" stroke-width="1.6" d="M737.48,-75.96C737.48,-75.96 572.51,-75.96 572.51,-75.96 566.51,-75.96 560.51,-69.96 560.51,-63.96 560.51,-63.96 560.51,-45 560.51,-45 560.51,-39 566.51,-33 572.51,-33 572.51,-33 737.48,-33 737.48,-33 743.48,-33 749.48,-39 749.48,-45 749.48,-45 749.48,-63.96 749.48,-63.96 749.48,-69.96 743.48,-75.96 737.48,-75.96" />
      <text xml:space="preserve" text-anchor="start" x="581.12" y="-56.23" font-family="Arial" font-size="15.00" fill="#14263c">    </text>
      <text xml:space="preserve" text-anchor="start" x="599.12" y="-56.23" font-family="Arial" font-weight="bold" font-size="15.00" fill="#14263c">M · Merge commit</text>
      <text xml:space="preserve" text-anchor="start" x="569.87" y="-41.23" font-family="Arial" font-size="15.00" fill="#14263c">    </text>
      <text xml:space="preserve" text-anchor="start" x="587.87" y="-41.23" font-family="Arial" font-size="13.00" fill="#2e7d6b">"degrees + shortest arc"</text>
      <text xml:space="preserve" text-anchor="start" x="731.12" y="-41.23" font-family="Arial" font-size="15.00" fill="#14263c">  </text>
