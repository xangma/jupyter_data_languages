  <title id="agent-review-loop-title">Keep scientific expectations under human control</title>
  <desc id="agent-review-loop-desc">A student supplies the task and independently justified tests, reviews an agent plan, authorises a bounded implementation change, independently reruns and reviews, then accepts or steers. The agreed tests remain fixed during repair.</desc>
