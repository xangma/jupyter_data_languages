  <title id="agent-review-loop-title">Keep scientific expectations under human control</title>
  <desc id="agent-review-loop-desc">A student supplies the task and independently justified expectations, reviews an agent plan and derives test cases, reviews the drafted test_student_checks.py, verifies the failing run and commits a fixed tests checkpoint before authorising the weighted_mean.py repair, then reruns independently and inspects the diff before accepting.</desc>
