      <text xml:space="preserve" text-anchor="start" x="106.71" y="-197.57" font-family="Arial" font-weight="bold" font-size="14.00" fill="#2e7d6b">2 · merge / git pull</text>
      <text xml:space="preserve" text-anchor="start" x="94.34" y="-183.57" font-family="Arial" font-size="12.00" fill="#2e7d6b">integrates R3 into branch</text>
      <text xml:space="preserve" text-anchor="start" x="227.84" y="-183.57" font-family="Arial" font-size="14.00" fill="#2e7d6b"> </text>
    </g>
    <g id="node4" class="node">
      <title>rejected</title>
