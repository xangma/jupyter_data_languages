    <title>git_remotes</title>
    <polygon fill="white" stroke="none" points="-11.52,11.52 -11.52,-361.77 865.88,-361.77 865.88,11.52 -11.52,11.52" />
    <text xml:space="preserve" text-anchor="middle" x="427.18" y="-327.25" font-family="Arial" font-size="20.00" fill="#14263c">How clone, fetch, pull and push synchronise two repositories</text>
    <g id="clust1" class="cluster">
