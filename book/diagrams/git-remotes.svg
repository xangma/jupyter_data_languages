      <text xml:space="preserve" text-anchor="start" x="120.71" y="-148.53" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">Remote-tracking ref</text>
      <text xml:space="preserve" text-anchor="start" x="79.84" y="-133.03" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="106.84" y="-133.03" font-family="Arial" font-size="13.00" fill="#14263c">origin/main (or practice/main)</text>
      <text xml:space="preserve" text-anchor="start" x="65.96" y="-117.53" font-family="Arial" font-size="13.00" fill="#14263c">      Local bookmark of remote state</text>
      <text xml:space="preserve" text-anchor="start" x="275.96" y="-117.53" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
