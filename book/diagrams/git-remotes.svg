      <text xml:space="preserve" text-anchor="start" x="397.64" y="-194.88" font-family="Arial" font-weight="bold" font-size="14.00" fill="#2e7d6b">1 · git fetch</text>
      <text xml:space="preserve" text-anchor="start" x="347.76" y="-180.88" font-family="Arial" font-size="12.00" fill="#2e7d6b">downloads R3; files untouched</text>
