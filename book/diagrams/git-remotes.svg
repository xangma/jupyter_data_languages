      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" stroke-dasharray="5,2" points="826.36,-122.67 826.36,-116.67" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" stroke-dasharray="5,2" points="832.36,-116.67 826.36,-116.67" />
      <text xml:space="preserve" text-anchor="start" x="575.94" y="-101.03" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="602.94" y="-101.03" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">Why push can be rejected</text>
      <text xml:space="preserve" text-anchor="start" x="552.31" y="-85.53" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="579.31" y="-85.53" font-family="Arial" font-size="13.00" fill="#14263c">If remote has </text>
      <text xml:space="preserve" text-anchor="start" x="661.06" y="-85.53" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">R3</text>
      <text xml:space="preserve" text-anchor="start" x="678.31" y="-85.53" font-family="Arial" font-size="13.00" fill="#14263c"> that your branch lacks,</text>
      <text xml:space="preserve" text-anchor="start" x="555.31" y="-72.4" font-family="Arial" font-size="13.00" fill="#14263c">      git push stops safely (</text>
      <text xml:space="preserve" text-anchor="start" x="708.31" y="-72.4" font-family="Arial" font-style="italic" font-size="13.00" fill="#14263c">non-fast-forward</text>
      <text xml:space="preserve" text-anchor="start" x="806.56" y="-72.4" font-family="Arial" font-size="13.00" fill="#14263c">):</text>
      <text xml:space="preserve" text-anchor="start" x="548.56" y="-57.03" font-family="Arial" font-size="13.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="571.06" y="-57.03" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">fetch → pull/merge → pytest → push</text>
      <text xml:space="preserve" text-anchor="start" x="803.56" y="-57.03" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
