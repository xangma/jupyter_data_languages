      <text xml:space="preserve" text-anchor="start" x="393.89" y="-245.21" font-family="Arial" font-size="14.00" fill="#14263c"> </text>
      <text xml:space="preserve" text-anchor="start" x="397.64" y="-245.21" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">3 · git push</text>
      <text xml:space="preserve" text-anchor="start" x="370.64" y="-231.21" font-family="Arial" font-size="12.00" fill="#14263c">uploads local commits</text>
      <text xml:space="preserve" text-anchor="start" x="489.14" y="-231.21" font-family="Arial" font-size="14.00" fill="#14263c"> </text>
    </g>
    <g id="node3" class="node">
      <title>tracking</title>
      <path fill="#e9f7f2" stroke="#bac7d5" stroke-width="1.5" d="M292.76,-170.17C292.76,-170.17 67.16,-170.17 67.16,-170.17 61.16,-170.17 55.16,-164.17 55.16,-158.17 55.16,-158.17 55.16,-119.83 55.16,-119.83 55.16,-113.83 61.16,-107.83 67.16,-107.83 67.16,-107.83 292.76,-107.83 292.76,-107.83 298.76,-107.83 304.76,-113.83 304.76,-119.83 304.76,-119.83 304.76,-158.17 304.76,-158.17 304.76,-164.17 298.76,-170.17 292.76,-170.17" />
