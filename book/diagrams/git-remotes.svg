  <title id="git-remotes-title">Syncing a local clone with a remote</title>
  <desc id="git-remotes-desc">git clone makes the initial local copy; git fetch updates tracking ref origin/main from remote main; merge or pull integrates into the local branch; git push uploads local commits to remote main.</desc>
