      <text xml:space="preserve" text-anchor="middle" x="685.06" y="-253.9" font-family="Arial" font-size="18.00" fill="#14263c">Remote repository (origin / practice)</text>
    </g>
    <g id="node1" class="node">
      <title>clone_note</title>
      <polygon fill="#f0ebfa" stroke="#bac7d5" stroke-width="1.5" points="312.64,-84.17 41.29,-84.17 41.29,-21.83 318.64,-21.83 318.64,-78.17 312.64,-84.17" />
