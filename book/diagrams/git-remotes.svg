<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0.00 0.00 877.00 373.00" role="img" aria-labelledby="git-remotes-title git-remotes-desc">
  <title id="git-remotes-title">How clone, fetch, pull and push synchronise two repositories</title>
  <desc id="git-remotes-desc">git clone copies full .git history and sets origin; git fetch downloads remote commit R3 into remote-tracking ref origin/main without changing working files; merge or git pull integrates R3 into the local branch; git push uploads local commits and rejects non-fast-forward pushes safely when the remote has newer commits.</desc>
