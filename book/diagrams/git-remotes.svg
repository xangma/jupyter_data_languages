      <text xml:space="preserve" text-anchor="start" x="87.34" y="-246.78" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">Local branch &amp; working files</text>
      <text xml:space="preserve" text-anchor="start" x="44.96" y="-231.28" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="71.96" y="-231.28" font-family="Arial" font-size="13.00" fill="#14263c">main: C1 → C2 (plus local commit </text>
      <text xml:space="preserve" text-anchor="start" x="276.71" y="-231.28" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">L3</text>
      <text xml:space="preserve" text-anchor="start" x="292.46" y="-231.28" font-family="Arial" font-size="13.00" fill="#14263c">)</text>
      <text xml:space="preserve" text-anchor="start" x="296.96" y="-231.28" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
    <g id="node5" class="node">
      <title>remote_branch</title>
      <path fill="#fff2d6" stroke="#bac7d5" stroke-width="1.5" d="M792.99,-232.17C792.99,-232.17 577.14,-232.17 577.14,-232.17 571.14,-232.17 565.14,-226.17 565.14,-220.17 565.14,-220.17 565.14,-181.83 565.14,-181.83 565.14,-175.83 571.14,-169.83 577.14,-169.83 577.14,-169.83 792.99,-169.83 792.99,-169.83 798.99,-169.83 804.99,-175.83 804.99,-181.83 804.99,-181.83 804.99,-220.17 804.99,-220.17 804.99,-226.17 798.99,-232.17 792.99,-232.17" />
      <text xml:space="preserve" text-anchor="start" x="615.31" y="-210.53" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="642.31" y="-210.53" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">Remote branch</text>
      <text xml:space="preserve" text-anchor="start" x="607.44" y="-195.03" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="634.44" y="-195.03" font-family="Arial" font-size="13.00" fill="#14263c">main: C1 → C2 → </text>
      <text xml:space="preserve" text-anchor="start" x="745.44" y="-195.03" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">R3</text>
      <text xml:space="preserve" text-anchor="start" x="575.94" y="-179.53" font-family="Arial" font-size="13.00" fill="#14263c">      (</text>
      <text xml:space="preserve" text-anchor="start" x="602.94" y="-179.53" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">R3</text>
      <text xml:space="preserve" text-anchor="start" x="620.19" y="-179.53" font-family="Arial" font-size="13.00" fill="#14263c"> pushed by a collaborator)</text>
      <text xml:space="preserve" text-anchor="start" x="776.19" y="-179.53" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
    <g id="edge5" class="edge">
