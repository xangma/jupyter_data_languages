      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="318.64,-78.17 312.64,-78.17" />
      <text xml:space="preserve" text-anchor="start" x="52.09" y="-62.52" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="79.09" y="-62.52" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">0 · git clone &lt;url&gt;</text>
      <text xml:space="preserve" text-anchor="start" x="208.84" y="-62.52" font-family="Arial" font-size="15.50" fill="#14263c"> (once at start)</text>
      <text xml:space="preserve" text-anchor="start" x="67.09" y="-47.02" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="94.09" y="-47.02" font-family="Arial" font-size="13.00" fill="#14263c">Copies full .git history, checks out</text>
      <text xml:space="preserve" text-anchor="start" x="56.96" y="-31.52" font-family="Arial" font-size="13.00" fill="#14263c">      files, and names that remote origin</text>
      <text xml:space="preserve" text-anchor="start" x="284.96" y="-31.52" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
