  <title id="array-views-title">Slice view (shared memory) versus .copy()</title>
  <desc id="array-views-desc">From original = [10, 20, 30, 40], view = original[:2] followed by view[0] = 99 mutates the shared buffer to [99, 20, 30, 40], whereas sep = original[:2].copy() followed by sep[0] = -5 writes [-5, 20] in a new buffer and leaves original unchanged.</desc>
