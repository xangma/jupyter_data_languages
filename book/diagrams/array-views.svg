<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0.00 0.00 811.00 453.00" role="img" aria-labelledby="array-views-title array-views-desc">
  <title id="array-views-title">A NumPy slice is a view into shared memory; .copy() allocates new memory</title>
  <desc id="array-views-desc">Starting from original = np.array([10, 20, 30, 40]), assigning view[0] = 99 on view = original[:2] mutates the shared memory buffer so original becomes [99, 20, 30, 40], whereas separate = original[:2].copy() allocates independent memory so separate[0] = -5 leaves original intact.</desc>
