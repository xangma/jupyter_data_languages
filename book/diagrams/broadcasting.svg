<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="197" viewBox="0.00 0.00 811.00 222.00" role="img" aria-labelledby="broadcasting-title broadcasting-desc">
  <title id="broadcasting-title">Broadcast M trial slopes against N galaxies, then sum across axis=1</title>
  <desc id="broadcasting-desc">Column vector h0_grid[:, None] of shape (M, 1) with M = 201 trial slopes multiplies distance[valid] of shape (N,) treated as (1, N) across N = 395 galaxies plus intercept 300 to form the (M, N) prediction matrix v_model with entries H_i d_j + 300, followed by .sum(axis=1) collapsing across the N galaxy columns into chi2 of shape (M,) with one chi-squared score per trial H0.</desc>
