<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="241" viewBox="0.00 0.00 934.00 312.00" role="img" aria-labelledby="git-undo-vs-revert-title git-undo-vs-revert-desc">
  <title id="git-undo-vs-revert-title">Private reset rewinds the branch pointer; shared revert adds a new inverse commit</title>
  <desc id="git-undo-vs-revert-desc">Two timelines from C1 (good) to C2 (mistake): git reset --soft HEAD~1 rewinds private branch recovery-lab back to C1 while keeping C2's changes staged to fix and recommit, whereas git revert HEAD and git push keep C2 in shared history and add inverse commit C3 so collaborators fast-forward safely.</desc>
