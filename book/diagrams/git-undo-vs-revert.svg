  <title id="git-undo-vs-revert-title">Private soft reset versus shared forward revert</title>
  <desc id="git-undo-vs-revert-desc">Top panel shows git reset --soft HEAD~1 rewinding a private unpushed branch from C2 back to C1 while keeping edits staged; bottom panel shows git revert HEAD keeping pushed mistake C2 in history and adding C3 to revert it safely.</desc>
