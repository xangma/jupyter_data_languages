<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="223" viewBox="0.00 0.00 951.00 294.00" role="img" aria-labelledby="nyquist-aliasing-title nyquist-aliasing-desc">
  <title id="nyquist-aliasing-title">Frequencies above Nyquist fold back into the resolved [0, fs/2] band</title>
  <desc id="nyquist-aliasing-desc">At a 512 Hz sampling rate with Nyquist limit 256 Hz, a 40 Hz tone stays resolved at 40 Hz, whereas a 300 Hz tone (256 + 44 Hz) folds across the 256 Hz mirror to an alias at 212 Hz (512 - 300 = 256 - 44 Hz) that is indistinguishable at 1/512 s discrete samples.</desc>
  <g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(11.52 282.73)">
    <title>nyquist_aliasing</title>
    <polygon fill="white" stroke="none" points="-11.52,11.52 -11.52,-282.73 939.52,-282.73 939.52,11.52 -11.52,11.52" />
    <text xml:space="preserve" text-anchor="middle" x="464" y="-248.21" font-family="Arial" font-size="20.00" fill="#14263c">Frequencies above Nyquist fold back into the resolved [0, fs/2] band</text>
    <g id="clust1" class="cluster">
      <title>cluster_resolved</title>
      <path fill="#f9fcfb" stroke="#bac7d5" d="M20,-63.56C20,-63.56 421,-63.56 421,-63.56 427,-63.56 433,-69.56 433,-75.56 433,-75.56 433,-170.96 433,-170.96 433,-176.96 427,-182.96 421,-182.96 421,-182.96 20,-182.96 20,-182.96 14,-182.96 8,-176.96 8,-170.96 8,-170.96 8,-75.56 8,-75.56 8,-69.56 14,-63.56 20,-63.56" />
      <text xml:space="preserve" text-anchor="middle" x="220.5" y="-161.86" font-family="Arial" font-size="18.00" fill="#14263c">Resolved band  [0, 256 Hz]</text>
    </g>
