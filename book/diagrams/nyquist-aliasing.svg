      <text xml:space="preserve" text-anchor="start" x="529.75" y="-118.56" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
      <text xml:space="preserve" text-anchor="start" x="547.75" y="-118.56" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">Nyquist</text>
      <text xml:space="preserve" text-anchor="start" x="533.5" y="-102.56" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
      <text xml:space="preserve" text-anchor="start" x="551.5" y="-102.56" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">256 Hz</text>
      <text xml:space="preserve" text-anchor="start" x="536.5" y="-86.56" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
