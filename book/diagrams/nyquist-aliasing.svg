      <text xml:space="preserve" text-anchor="middle" x="795.5" y="-161.86" font-family="Arial" font-size="18.00" fill="#14263c">Above Nyquist  (256, 512 Hz)</text>
    </g>
    <g id="node1" class="node">
      <title>setup</title>
      <path fill="#eaf3fe" stroke="#bac7d5" stroke-width="1.5" d="M749.2,-239.96C749.2,-239.96 150.8,-239.96 150.8,-239.96 144.8,-239.96 138.8,-233.96 138.8,-227.96 138.8,-227.96 138.8,-215.96 138.8,-215.96 138.8,-209.96 144.8,-203.96 150.8,-203.96 150.8,-203.96 749.2,-203.96 749.2,-203.96 755.2,-203.96 761.2,-209.96 761.2,-215.96 761.2,-215.96 761.2,-227.96 761.2,-227.96 761.2,-233.96 755.2,-239.96 749.2,-239.96" />
      <text xml:space="preserve" text-anchor="start" x="148.88" y="-217.13" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
      <text xml:space="preserve" text-anchor="start" x="166.88" y="-217.13" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">Sampling rate:</text>
      <text xml:space="preserve" text-anchor="start" x="277.88" y="-217.13" font-family="Arial" font-size="16.00" fill="#14263c"> f</text>
      <text xml:space="preserve" text-anchor="start" x="286.88" y="-217.13" font-family="Arial" baseline-shift="sub" font-size="16.00" fill="#14263c">s</text>
      <text xml:space="preserve" text-anchor="start" x="293.62" y="-217.13" font-family="Arial" font-size="16.00" fill="#14263c"> = 512 Hz (Δt = 1/512 s)   ·   </text>
      <text xml:space="preserve" text-anchor="start" x="496.12" y="-217.13" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">Nyquist limit:</text>
      <text xml:space="preserve" text-anchor="start" x="597.38" y="-217.13" font-family="Arial" font-size="16.00" fill="#14263c"> f</text>
      <text xml:space="preserve" text-anchor="start" x="606.38" y="-217.13" font-family="Arial" baseline-shift="sub" font-size="16.00" fill="#14263c">Nyq</text>
      <text xml:space="preserve" text-anchor="start" x="630.38" y="-217.13" font-family="Arial" font-size="16.00" fill="#14263c"> = f</text>
      <text xml:space="preserve" text-anchor="start" x="652.88" y="-217.13" font-family="Arial" baseline-shift="sub" font-size="16.00" fill="#14263c">s</text>
      <text xml:space="preserve" text-anchor="start" x="659.62" y="-217.13" font-family="Arial" font-size="16.00" fill="#14263c">/2 = 256 Hz  </text>
    </g>
