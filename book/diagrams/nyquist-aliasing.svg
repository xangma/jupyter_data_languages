      <text xml:space="preserve" text-anchor="start" x="42.83" y="-27.75" font-family="Arial" font-size="15.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="69.83" y="-27.75" font-family="Arial" font-size="12.00" fill="#2e7d6b">resolved</text>
