    <polygon fill="white" stroke="none" points="-10.08,10.08 -10.08,-213.08 623.71,-213.08 623.71,10.08 -10.08,10.08" />
    <text xml:space="preserve" text-anchor="middle" x="306.82" y="-181.9" font-family="Arial" font-size="18.00" fill="#14263c">Nyquist folding (fs = 512 Hz)</text>
    <g id="clust1" class="cluster">
      <title>cluster_resolved</title>
      <path fill="white" stroke="#bac7d5" d="M16.96,-8C16.96,-8 160.46,-8 160.46,-8 166.46,-8 172.46,-14 172.46,-20 172.46,-20 172.46,-154 172.46,-154 172.46,-160 166.46,-166 160.46,-166 160.46,-166 16.96,-166 16.96,-166 10.96,-166 4.96,-160 4.96,-154 4.96,-154 4.96,-20 4.96,-20 4.96,-14 10.96,-8 16.96,-8" />
      <text xml:space="preserve" text-anchor="middle" x="88.71" y="-146.32" font-family="Arial" font-size="16.50" fill="#14263c">Resolved [0, 256 Hz]</text>
    </g>
