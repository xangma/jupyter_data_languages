      <text xml:space="preserve" text-anchor="start" x="277" y="-102.56" font-family="Arial" font-size="16.00" fill="#14263c">      256 − 44 Hz</text>
      <text xml:space="preserve" text-anchor="start" x="259.38" y="-86.56" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="286.38" y="-86.56" font-family="Arial" font-size="14.00" fill="#14263c">f</text>
      <text xml:space="preserve" text-anchor="start" x="290.12" y="-86.56" font-family="Arial" baseline-shift="sub" font-size="14.00" fill="#14263c">alias</text>
      <text xml:space="preserve" text-anchor="start" x="314.12" y="-86.56" font-family="Arial" font-size="14.00" fill="#14263c"> = 512 − 300</text>
      <text xml:space="preserve" text-anchor="start" x="390.62" y="-86.56" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
