      <text xml:space="preserve" text-anchor="middle" x="528.8" y="-146.32" font-family="Arial" font-size="16.50" fill="#14263c">Above Nyquist</text>
    </g>
    <g id="node1" class="node">
      <title>f40</title>
      <path fill="#e9f7f2" stroke="#bac7d5" stroke-width="1.5" d="M131.66,-62.48C131.66,-62.48 44.75,-62.48 44.75,-62.48 38.75,-62.48 32.75,-56.48 32.75,-50.48 32.75,-50.48 32.75,-31.52 32.75,-31.52 32.75,-25.52 38.75,-19.52 44.75,-19.52 44.75,-19.52 131.66,-19.52 131.66,-19.52 137.66,-19.52 143.66,-25.52 143.66,-31.52 143.66,-31.52 143.66,-50.48 143.66,-50.48 143.66,-56.48 137.66,-62.48 131.66,-62.48" />
