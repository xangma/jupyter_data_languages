<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="634" height="223" viewBox="0.00 0.00 634.00 223.00" role="img" aria-labelledby="nyquist-aliasing-title nyquist-aliasing-desc">
  <title id="nyquist-aliasing-title">Nyquist folding at fs = 512 Hz</title>
  <desc id="nyquist-aliasing-desc">With 256 Hz Nyquist limit, a 40 Hz tone stays resolved in [0, 256 Hz], whereas a 300 Hz tone (256 + 44 Hz) folds across 256 Hz to a 212 Hz alias (512 - 300 Hz).</desc>
