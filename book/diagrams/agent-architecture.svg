  <title id="agent-architecture-title">Locate the client, model and tool execution</title>
  <desc id="agent-architecture-desc">In a laptop Cline session, Qwen inference runs on CPD, while permission-controlled file and terminal tools run with the client. An OS shell sandbox is a separate boundary only in tools that provide one.</desc>
