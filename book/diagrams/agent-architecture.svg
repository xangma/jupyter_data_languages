<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="501" viewBox="0.00 0.00 753.00 524.00" role="img" aria-labelledby="agent-architecture-title agent-architecture-desc">
  <title id="agent-architecture-title">Locate the client, model and tool execution</title>
  <desc id="agent-architecture-desc">On your workstation (for example VS Code or a terminal), the agent client (Claude Code, Codex or Cline) mediates permission-controlled file and terminal tools against local workspace files, while an LLM endpoint (cloud API or local server) only receives context and proposes next steps. An OS shell sandbox is a separate boundary only in tools that provide one.</desc>
