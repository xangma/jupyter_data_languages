<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0.00 0.00 806.00 437.00" role="img" aria-labelledby="python-environments-title python-environments-desc">
  <title id="python-environments-title">Lock one project environment and point both kernel and shell at it</title>
  <desc id="python-environments-desc">Three dependency solvers and environment tools — uv solving and locking the PyPI graph via uv sync --frozen --extra teaching, pip + venv resolving against the current environment via python -m pip install, and conda or mamba solving Python plus compiled C and CUDA libraries such as CFITSIO, FFTW and MPI — build an isolated project environment (.venv or conda env, /opt/course/.venv on CPD). Two aligned paths — the Python PhD (locked) Jupyter kernel via ipykernel and an activated shell via source activate or uv run — execute inside that project environment, whereas an unactivated shell running bare pip install or pytest hits /usr/bin/python3 or conda (base) and raises ModuleNotFoundError.</desc>
