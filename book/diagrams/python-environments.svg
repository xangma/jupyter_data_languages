  <title id="python-environments-title">One project environment for both kernel and shell</title>
  <desc id="python-environments-desc">Pick one solver per project (uv with uv.lock, pip + venv, or conda/mamba for Python + C/GPU) to build an isolated .venv/bin/python used by both the Python PhD (locked) Jupyter kernel and an activated shell, whereas an unactivated shell bypasses .venv and raises ModuleNotFoundError.</desc>
