<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0.00 0.00 778.00 499.00" role="img" aria-labelledby="python-environments-title python-environments-desc">
  <title id="python-environments-title">Lock one project environment and point both kernel and terminal at it</title>
  <desc id="python-environments-desc">Three environment workflows encountered in astrophysics research — uv with pyproject.toml and uv.lock via uv sync --frozen, pip + venv with python -m venv .venv and python -m pip, and conda or mamba with environment.yml and conda-forge C, Fortran and CUDA libraries such as CFITSIO, FFTW and healpy — build an isolated project environment (.venv/bin/python or /opt/course/.venv/bin/python with Python 3.13, NumPy 2, Astropy, SciPy, Matplotlib and pytest). Two aligned execution paths — the Python PhD (locked) Jupyter kernel via ipykernel and an activated terminal via source activate or uv run — use that .venv interpreter, whereas an unactivated terminal running bare pip install or pytest hits system /usr/bin/python3 or conda (base) and causes ModuleNotFoundError or version mismatches.</desc>
