<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="447" viewBox="0.00 0.00 772.00 479.00" role="img" aria-labelledby="fits-vs-ecsv-title fits-vs-ecsv-desc">
  <title id="fits-vs-ecsv-title">ECSV stores space-delimited text + YAML; FITS packs Header/Data Units (HDUs)</title>
  <desc id="fits-vs-ecsv-desc">Side-by-side comparison of Astropy ECSV 1.0 plain-text YAML headers (# %ECSV 1.0, datatype and nested meta dicts above space-delimited text rows) against FITS binary containers (HDU 0 Primary HDU with no data plus HDU 1 Binary Table HDU preserving &lt;=8-character keywords and TUNITn column units while &gt;8-character keys trigger HIERARCH warnings and nested dicts fail).</desc>
