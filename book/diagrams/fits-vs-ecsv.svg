<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="488" viewBox="0.00 0.00 721.00 489.00" role="img" aria-labelledby="fits-vs-ecsv-title fits-vs-ecsv-desc">
  <title id="fits-vs-ecsv-title">ECSV stores text + YAML metadata; FITS packs Header + Data Units (HDUs)</title>
  <desc id="fits-vs-ecsv-desc">Side-by-side comparison of ECSV plain-text YAML metadata headers (preserving units, datatypes and arbitrary nested table.meta dicts above CSV rows) against FITS binary multi-HDU containers (Primary Header plus Binary Table HDU with TTYPEn, TFORMn and TUNITn cards whose strict 8-character keyword rules reject arbitrary nested meta dicts).</desc>
