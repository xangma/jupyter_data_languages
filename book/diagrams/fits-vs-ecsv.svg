  <title id="fits-vs-ecsv-title">Text ECSV versus binary FITS</title>
  <desc id="fits-vs-ecsv-desc">ECSV pairs a #-commented YAML header (units and metadata) with plain-text rows; FITS pairs Primary HDU 0 with Binary Table HDU 1 storing column units and short &lt;=8-character header cards.</desc>
