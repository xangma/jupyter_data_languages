  <title id="git-clone-fork-pr-title">Team repository versus open-source Fork and Pull Request workflow</title>
  <desc id="git-clone-fork-pr-desc">Top panel shows a shared group repository with write access: git clone from origin, create a local branch, push to origin, and open a Pull Request into main. Bottom panel shows an external repository without write access: Fork upstream on GitHub into your personal origin, git clone origin locally, push a branch to origin, open a Pull Request back to upstream/main, and fetch upstream to stay synchronised.</desc>
