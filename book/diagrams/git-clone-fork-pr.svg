  <title id="git-clone-fork-pr-title">Group repository versus open-source Fork and Pull Request</title>
  <desc id="git-clone-fork-pr-desc">Top panel shows a group repository with write access (clone origin, push branch, open PR into main); bottom panel shows an external repository without write access (Fork upstream to personal origin, clone, push to origin, open PR to upstream, and fetch upstream).</desc>
