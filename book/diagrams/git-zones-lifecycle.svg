      <text xml:space="preserve" text-anchor="start" x="477.25" y="-61.34" font-family="Arial" font-weight="bold" font-size="14.00" fill="#2e7d6b">← git fetch</text>
      <text xml:space="preserve" text-anchor="start" x="547.75" y="-61.34" font-family="Arial" font-size="14.00" fill="#2e7d6b"> (refs only)</text>
      <text xml:space="preserve" text-anchor="start" x="611.5" y="-61.34" font-family="Arial" font-size="14.00" fill="#14263c"> </text>
    </g>
    <g id="node5" class="node">
      <title>shortcuts</title>
      <polygon fill="#f3f5f7" stroke="#bac7d5" stroke-width="1.5" points="1020.64,-340.34 617.36,-340.34 617.36,-262.06 1026.64,-262.06 1026.64,-334.34 1020.64,-340.34" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="1020.64,-340.34 1020.64,-334.34" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="1026.64,-334.34 1020.64,-334.34" />
      <text xml:space="preserve" text-anchor="start" x="687.38" y="-317.5" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="714.38" y="-317.5" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">Multi-step &amp; discard commands</text>
      <text xml:space="preserve" text-anchor="start" x="632.62" y="-301.5" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="659.62" y="-301.5" font-family="Arial" font-size="13.00" fill="#14263c">• </text>
      <text xml:space="preserve" text-anchor="start" x="667.88" y="-301.5" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">git clone URL</text>
      <text xml:space="preserve" text-anchor="start" x="754.88" y="-301.5" font-family="Arial" font-size="13.00" fill="#14263c"> — copy Remote → new .git + Working tree</text>
      <text xml:space="preserve" text-anchor="start" x="646.12" y="-288.35" font-family="Arial" font-size="13.00" fill="#14263c">      • </text>
      <text xml:space="preserve" text-anchor="start" x="676.88" y="-288.35" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">git pull</text>
      <text xml:space="preserve" text-anchor="start" x="721.12" y="-288.35" font-family="Arial" font-size="13.00" fill="#14263c"> — git fetch + merge into current branch &amp; files</text>
      <text xml:space="preserve" text-anchor="start" x="628.88" y="-272.5" font-family="Arial" font-size="13.00" fill="#14263c">      • </text>
      <text xml:space="preserve" text-anchor="start" x="659.62" y="-272.5" font-family="Arial" font-weight="bold" font-size="13.00" fill="#14263c">git restore -- file</text>
      <text xml:space="preserve" text-anchor="start" x="761.62" y="-272.5" font-family="Arial" font-size="13.00" fill="#14263c"> — discard unstaged Working-tree edits</text>
      <text xml:space="preserve" text-anchor="start" x="997.12" y="-272.5" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
    </g>
  </g>
