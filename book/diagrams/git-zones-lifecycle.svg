      <text xml:space="preserve" text-anchor="start" x="182.38" y="-185.47" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">2 · Staging index</text>
      <text xml:space="preserve" text-anchor="start" x="89" y="-169.47" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="116" y="-169.47" font-family="Arial" font-size="14.00" fill="#14263c">Exact snapshot queued for the next commit</text>
      <text xml:space="preserve" text-anchor="start" x="90.12" y="-153.47" font-family="Arial" font-size="14.00" fill="#14263c">      Inspect with:  git status  ·  git diff --staged</text>
      <text xml:space="preserve" text-anchor="start" x="357.88" y="-153.47" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
    </g>
