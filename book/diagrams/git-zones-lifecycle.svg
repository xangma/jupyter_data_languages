  <title id="git-zones-lifecycle-title">Git zones and commands</title>
  <desc id="git-zones-lifecycle-desc">Four zones from left to right — Working tree (saved files), Staging index (next snapshot), Local .git (commits), and Remote (origin) — connected by git add, git commit, git push, restore --staged, reset --soft, git fetch, and git clone or git pull.</desc>
