<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0.00 0.00 1074.00 448.00" role="img" aria-labelledby="git-zones-lifecycle-title git-zones-lifecycle-desc">
  <title id="git-zones-lifecycle-title">Four places your work lives and which Git command moves between them</title>
  <desc id="git-zones-lifecycle-desc">Left-to-right flow across Working tree (saved files on disk), Staging index (snapshot queued via git add, unstaged safely via git restore --staged), Local history in .git (commits created via git commit, rewound privately via git reset --soft HEAD~1), and Remote repository (updated via git push, inspected via git fetch, and copied or integrated via git clone and git pull).</desc>
  <g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(11.52 436.11)">
    <title>git_zones_lifecycle</title>
    <polygon fill="white" stroke="none" points="-11.52,11.52 -11.52,-436.11 1062.52,-436.11 1062.52,11.52 -11.52,11.52" />
    <text xml:space="preserve" text-anchor="middle" x="525.5" y="-401.59" font-family="Arial" font-size="20.00" fill="#14263c">Four places your work lives — and which Git command moves between them</text>
    <g id="clust1" class="cluster">
      <title>cluster_local</title>
      <path fill="white" stroke="#bac7d5" d="M20,-8C20,-8 581,-8 581,-8 587,-8 593,-14 593,-20 593,-20 593,-366.84 593,-366.84 593,-372.84 587,-378.84 581,-378.84 581,-378.84 20,-378.84 20,-378.84 14,-378.84 8,-372.84 8,-366.84 8,-366.84 8,-20 8,-20 8,-14 14,-8 20,-8" />
      <text xml:space="preserve" text-anchor="middle" x="300.5" y="-357.74" font-family="Arial" font-size="18.00" fill="#14263c">On your computer (offline, no account required)</text>
    </g>
    <g id="clust2" class="cluster">
      <title>cluster_remote</title>
      <path fill="white" stroke="#bac7d5" d="M613,-8C613,-8 1031,-8 1031,-8 1037,-8 1043,-14 1043,-20 1043,-20 1043,-373.34 1043,-373.34 1043,-379.34 1037,-385.34 1031,-385.34 1031,-385.34 613,-385.34 613,-385.34 607,-385.34 601,-379.34 601,-373.34 601,-373.34 601,-20 601,-20 601,-14 607,-8 613,-8" />
      <text xml:space="preserve" text-anchor="middle" x="822" y="-364.24" font-family="Arial" font-size="18.00" fill="#14263c">Shared server or bare folder</text>
    </g>
