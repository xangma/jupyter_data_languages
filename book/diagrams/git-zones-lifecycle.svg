      <text xml:space="preserve" text-anchor="start" x="171.5" y="-66.44" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">3 · Local history (.git)</text>
      <text xml:space="preserve" text-anchor="start" x="82.25" y="-50.44" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="109.25" y="-50.44" font-family="Arial" font-size="14.00" fill="#14263c">Permanent commit snapshots  (HEAD → main)</text>
      <text xml:space="preserve" text-anchor="start" x="107.75" y="-34.44" font-family="Arial" font-size="14.00" fill="#14263c">      Inspect with:  git log --oneline --graph</text>
      <text xml:space="preserve" text-anchor="start" x="352.25" y="-34.44" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
    </g>
    <g id="edge3" class="edge">
      <title>index-&gt;local_repo</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M77.07,-155.87C49.96,-146.03 35.33,-131.07 52.75,-108.28 56.64,-103.19 63.53,-98.49 72.43,-94.18" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="73.39,-96.89 79.75,-90.96 71.08,-91.63 73.39,-96.89" />
