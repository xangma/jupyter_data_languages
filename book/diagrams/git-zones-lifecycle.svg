      <text xml:space="preserve" text-anchor="start" x="251.94" y="-110.73" font-family="Arial" font-size="14.00" fill="#526780">  git reset --soft HEAD~1 (undo private commit)  </text>
    </g>
    <g id="node4" class="node">
      <title>remote</title>
      <path fill="#fff2d6" stroke="#bac7d5" stroke-width="1.5" d="M946.77,-89.28C946.77,-89.28 697.23,-89.28 697.23,-89.28 691.23,-89.28 685.23,-83.28 685.23,-77.28 685.23,-77.28 685.23,-36 685.23,-36 685.23,-30 691.23,-24 697.23,-24 697.23,-24 946.77,-24 946.77,-24 952.77,-24 958.77,-30 958.77,-36 958.77,-36 958.77,-77.28 958.77,-77.28 958.77,-83.28 952.77,-89.28 946.77,-89.28" />
      <text xml:space="preserve" text-anchor="start" x="696.75" y="-66.44" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="723.75" y="-66.44" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">4 · Remote repository (origin)</text>
      <text xml:space="preserve" text-anchor="start" x="703.5" y="-50.44" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="730.5" y="-50.44" font-family="Arial" font-size="14.00" fill="#14263c">GitHub, GitLab, institutional server,</text>
      <text xml:space="preserve" text-anchor="start" x="729" y="-34.44" font-family="Arial" font-size="14.00" fill="#14263c">      or another folder on disk</text>
      <text xml:space="preserve" text-anchor="start" x="897" y="-34.44" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
    </g>
    <g id="edge6" class="edge">
      <title>local_repo-&gt;remote</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M418.4,-56.64C500.51,-56.64 596.62,-56.64 674.45,-56.64" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="418.64,-53.77 410.44,-56.64 418.64,-59.51 418.64,-53.77" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="674.2,-59.51 682.4,-56.64 674.2,-53.77 674.2,-59.51" />
      <text xml:space="preserve" text-anchor="start" x="509.12" y="-75.34" font-family="Arial" font-size="14.00" fill="#14263c"> </text>
