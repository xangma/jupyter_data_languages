      <text xml:space="preserve" text-anchor="start" x="107" y="-230.76" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">git add</text>
      <text xml:space="preserve" text-anchor="start" x="151.25" y="-230.76" font-family="Arial" font-size="14.00" fill="#14263c"> (stage snapshot)  </text>
    </g>
