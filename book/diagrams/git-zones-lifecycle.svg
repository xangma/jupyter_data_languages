      <text xml:space="preserve" text-anchor="start" x="180.12" y="-311" font-family="Arial" font-weight="bold" font-size="16.00" fill="#14263c">1 · Working tree</text>
      <text xml:space="preserve" text-anchor="start" x="65" y="-295" font-family="Arial" font-size="16.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="92" y="-295" font-family="Arial" font-size="14.00" fill="#14263c">Saved files on disk (U = untracked, M = modified)</text>
      <text xml:space="preserve" text-anchor="start" x="90.88" y="-279" font-family="Arial" font-size="14.00" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="113.38" y="-279" font-family="Arial" font-style="italic" font-size="14.00" fill="#14263c">Unsaved editor tabs are invisible to Git</text>
      <text xml:space="preserve" text-anchor="start" x="345.12" y="-279" font-family="Arial" font-size="16.00" fill="#14263c">    </text>
    </g>
