      <text xml:space="preserve" text-anchor="start" x="60.25" y="-111.73" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">git commit</text>
      <text xml:space="preserve" text-anchor="start" x="130" y="-111.73" font-family="Arial" font-size="14.00" fill="#14263c"> (record snapshot)  </text>
