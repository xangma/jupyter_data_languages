      <text xml:space="preserve" text-anchor="start" x="268.47" y="-229.76" font-family="Arial" font-size="14.00" fill="#526780">  git restore --staged (unstage safely)  </text>
    </g>
    <g id="node3" class="node">
      <title>local_repo</title>
      <path fill="#f0ebfa" stroke="#bac7d5" stroke-width="1.5" d="M395.27,-89.28C395.27,-89.28 82.73,-89.28 82.73,-89.28 76.73,-89.28 70.73,-83.28 70.73,-77.28 70.73,-77.28 70.73,-36 70.73,-36 70.73,-30 76.73,-24 82.73,-24 82.73,-24 395.27,-24 395.27,-24 401.27,-24 407.27,-30 407.27,-36 407.27,-36 407.27,-77.28 407.27,-77.28 407.27,-83.28 401.27,-89.28 395.27,-89.28" />
