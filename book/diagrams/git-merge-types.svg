<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="227" viewBox="0.00 0.00 1144.00 361.00" role="img" aria-labelledby="git-merge-types-title git-merge-types-desc">
  <title id="git-merge-types-title">Fast-forward pointer move versus three-way merge commit</title>
  <desc id="git-merge-types-desc">Top panel shows a fast-forward merge where main stayed at C1 while test-wraparound advanced to C2, so git merge slides main forward to C2 with no extra commit. Bottom panel shows diverged branches A and B joining in a two-parent merge commit M automatically when different lines changed, or pausing for human conflict resolution when the same lines changed differently.</desc>
  <g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(10.08 351.33)">
    <title>git_merge_types</title>
    <polygon fill="white" stroke="none" points="-10.08,10.08 -10.08,-351.33 1134.29,-351.33 1134.29,10.08 -10.08,10.08" />
    <text xml:space="preserve" text-anchor="middle" x="562.11" y="-318.25" font-family="Arial" font-size="20.00" fill="#14263c">What a merge does: fast-forward pointer move vs three-way merge commit</text>
    <g id="clust1" class="cluster">
      <title>cluster_3way</title>
      <path fill="white" stroke="#bac7d5" d="M20,-8C20,-8 1104.21,-8 1104.21,-8 1110.21,-8 1116.21,-14 1116.21,-20 1116.21,-20 1116.21,-151 1116.21,-151 1116.21,-157 1110.21,-163 1104.21,-163 1104.21,-163 20,-163 20,-163 14,-163 8,-157 8,-151 8,-151 8,-20 8,-20 8,-14 14,-8 20,-8" />
      <text xml:space="preserve" text-anchor="middle" x="562.11" y="-142.38" font-family="Arial" font-size="17.50" fill="#14263c">2 · Three-way merge (both branches added commits)</text>
    </g>
    <g id="clust2" class="cluster">
      <title>cluster_ff</title>
      <path fill="white" stroke="#bac7d5" d="M20,-171C20,-171 696.55,-171 696.55,-171 702.55,-171 708.55,-177 708.55,-183 708.55,-183 708.55,-290 708.55,-290 708.55,-296 702.55,-302 696.55,-302 696.55,-302 20,-302 20,-302 14,-302 8,-296 8,-290 8,-290 8,-183 8,-183 8,-177 14,-171 20,-171" />
      <text xml:space="preserve" text-anchor="middle" x="358.28" y="-281.38" font-family="Arial" font-size="17.50" fill="#14263c">1 · Fast-forward merge (main stayed at C1)</text>
    </g>
    <g id="node1" class="node">
      <title>t_c1</title>
      <ellipse fill="#f3f5f7" stroke="#bac7d5" stroke-width="1.5" cx="42.16" cy="-67" rx="20.16" ry="20.16" />
      <text xml:space="preserve" text-anchor="middle" x="42.16" y="-61.27" font-family="Arial" font-size="15.50" fill="#14263c">C1</text>
    </g>
    <g id="node2" class="node">
      <title>t_a</title>
      <ellipse fill="#eaf3fe" stroke="#bac7d5" stroke-width="1.5" cx="203.98" cy="-42" rx="20.16" ry="20.16" />
      <text xml:space="preserve" text-anchor="middle" x="203.98" y="-36.27" font-family="Arial" font-size="15.50" fill="#14263c">A</text>
    </g>
    <g id="edge1" class="edge">
      <title>t_c1-&gt;t_a</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M61.79,-60.55C65.88,-59.31 70.22,-58.13 74.32,-57.25 107.77,-50.1 146.87,-46.06 173.11,-43.96" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="173,-46.78 180.76,-43.39 172.57,-41.2 173,-46.78" />
      <text xml:space="preserve" text-anchor="middle" x="123.07" y="-59.7" font-family="Arial" font-size="14.00" fill="#14263c">main</text>
    </g>
    <g id="node3" class="node">
      <title>t_b</title>
      <ellipse fill="#fff2d6" stroke="#bac7d5" stroke-width="1.5" cx="203.98" cy="-101" rx="20.16" ry="20.16" />
      <text xml:space="preserve" text-anchor="middle" x="203.98" y="-95.28" font-family="Arial" font-size="15.50" fill="#14263c">B</text>
    </g>
    <g id="edge2" class="edge">
      <title>t_c1-&gt;t_b</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M62.44,-71.1C90.16,-77 141.49,-87.92 173.85,-94.8" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="172.86,-97.45 181.26,-96.38 174.02,-91.98 172.86,-97.45" />
      <text xml:space="preserve" text-anchor="middle" x="123.07" y="-96.11" font-family="Arial" font-size="14.00" fill="#14263c">feature</text>
    </g>
    <g id="node4" class="node">
      <title>t_m</title>
      <ellipse fill="#f0ebfa" stroke="#bac7d5" stroke-width="1.5" cx="471.85" cy="-71" rx="21.6" ry="21.6" />
      <ellipse fill="none" stroke="#bac7d5" stroke-width="1.5" cx="471.85" cy="-71" rx="25.6" ry="25.6" />
      <text xml:space="preserve" text-anchor="middle" x="471.85" y="-65.28" font-family="Arial" font-size="15.50" fill="#14263c">M</text>
    </g>
    <g id="edge3" class="edge">
      <title>t_a-&gt;t_m</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M224.53,-44.13C269.14,-49 378.97,-60.98 435.68,-67.16" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="435.29,-69.94 443.55,-68.02 435.9,-64.37 435.29,-69.94" />
    </g>
    <g id="edge4" class="edge">
      <title>t_b-&gt;t_m</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M224.53,-98.79C269.14,-93.76 378.97,-81.37 435.68,-74.97" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="435.91,-77.76 443.55,-74.08 435.29,-72.19 435.91,-77.76" />
    </g>
    <g id="node5" class="node">
      <title>t_out</title>
      <polygon fill="#e9f7f2" stroke="#bac7d5" stroke-width="1.5" points="1096.21,-108.45 729.55,-108.45 729.55,-33.55 1102.21,-33.55 1102.21,-102.45 1096.21,-108.45" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="1096.21,-108.45 1096.21,-102.45" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="1102.21,-102.45 1096.21,-102.45" />
      <text xml:space="preserve" text-anchor="start" x="797.76" y="-87.53" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="824.76" y="-87.53" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">Two-parent merge commit M</text>
      <text xml:space="preserve" text-anchor="start" x="750.88" y="-72.03" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="777.88" y="-72.03" font-family="Arial" font-size="14.00" fill="#14263c">• </text>
      <text xml:space="preserve" text-anchor="start" x="786.88" y="-72.03" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">Different lines/files:</text>
      <text xml:space="preserve" text-anchor="start" x="912.13" y="-72.03" font-family="Arial" font-size="14.00" fill="#14263c"> Git creates </text>
      <text xml:space="preserve" text-anchor="start" x="985.63" y="-72.03" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">M</text>
      <text xml:space="preserve" text-anchor="start" x="997.63" y="-72.03" font-family="Arial" font-size="14.00" fill="#14263c"> automatically</text>
      <text xml:space="preserve" text-anchor="start" x="748.26" y="-57.95" font-family="Arial" font-size="14.00" fill="#14263c">      • </text>
      <text xml:space="preserve" text-anchor="start" x="779.76" y="-57.95" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">Same lines edited:</text>
      <text xml:space="preserve" text-anchor="start" x="899.01" y="-57.95" font-family="Arial" font-size="14.00" fill="#14263c"> </text>
      <text xml:space="preserve" text-anchor="start" x="902.76" y="-57.95" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">Conflict</text>
      <text xml:space="preserve" text-anchor="start" x="953.01" y="-57.95" font-family="Arial" font-size="14.00" fill="#14263c"> — Git pauses so you</text>
      <text xml:space="preserve" text-anchor="start" x="739.63" y="-42.52" font-family="Arial" font-size="14.00" fill="#14263c">        combine both facts, then git add + git commit → </text>
      <text xml:space="preserve" text-anchor="start" x="1062.13" y="-42.52" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">M</text>
      <text xml:space="preserve" text-anchor="start" x="1074.13" y="-42.52" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
    <g id="edge5" class="edge">
      <title>t_m-&gt;t_out</title>
      <path fill="none" stroke="#71849a" stroke-width="1.6" stroke-dasharray="5,2" d="M497.88,-71C542.53,-71 639.63,-71 728.91,-71" />
    </g>
    <g id="node6" class="node">
      <title>f_c1</title>
