      <text xml:space="preserve" text-anchor="middle" x="42.16" y="-216.28" font-family="Arial" font-size="15.50" fill="#14263c">C1</text>
    </g>
    <g id="node7" class="node">
      <title>f_c2</title>
      <ellipse fill="#eaf3fe" stroke="#bac7d5" stroke-width="1.5" cx="203.98" cy="-222" rx="20.16" ry="20.16" />
      <text xml:space="preserve" text-anchor="middle" x="203.98" y="-216.28" font-family="Arial" font-size="15.50" fill="#14263c">C2</text>
    </g>
    <g id="edge6" class="edge">
      <title>f_c1-&gt;f_c2</title>
      <path fill="none" stroke="#14263c" stroke-width="1.6" d="M59.68,-211.18C64.24,-208.75 69.32,-206.51 74.32,-205.25 116.34,-194.67 129.8,-194.67 171.82,-205.25 173.54,-205.68 175.27,-206.23 176.98,-206.86" />
      <polygon fill="#14263c" stroke="#14263c" stroke-width="1.6" points="175.81,-209.41 184.25,-210.18 178.14,-204.31 175.81,-209.41" />
      <text xml:space="preserve" text-anchor="middle" x="123.07" y="-207.7" font-family="Arial" font-size="14.00" fill="#14263c">test-wraparound</text>
    </g>
    <g id="edge7" class="edge">
      <title>f_c1-&gt;f_c2</title>
      <path fill="none" stroke="#2e7d6b" stroke-width="1.6" stroke-dasharray="5,2" d="M62.76,-222C90.32,-222 140.75,-222 173.03,-222" />
      <polygon fill="#2e7d6b" stroke="#2e7d6b" stroke-width="1.6" points="172.8,-224.8 180.8,-222 172.8,-219.2 172.8,-224.8" />
      <text xml:space="preserve" text-anchor="middle" x="123.07" y="-224.45" font-family="Arial" font-size="14.00" fill="#2e7d6b">main slides →</text>
    </g>
    <g id="node8" class="node">
      <title>f_note</title>
      <polygon fill="#e9f7f2" stroke="#bac7d5" stroke-width="1.5" points="688.55,-252.45 249.14,-252.45 249.14,-191.55 694.55,-191.55 694.55,-246.45 688.55,-252.45" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="688.55,-252.45 688.55,-246.45" />
      <polyline fill="none" stroke="#bac7d5" stroke-width="1.5" points="694.55,-246.45 688.55,-246.45" />
      <text xml:space="preserve" text-anchor="start" x="288.47" y="-231.53" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="315.47" y="-231.53" font-family="Arial" font-weight="bold" font-size="15.50" fill="#14263c">git switch main &amp;&amp; git merge test-wraparound</text>
      <text xml:space="preserve" text-anchor="start" x="313.22" y="-216.03" font-family="Arial" font-size="15.50" fill="#14263c">      </text>
      <text xml:space="preserve" text-anchor="start" x="340.22" y="-216.03" font-family="Arial" font-size="14.00" fill="#14263c">No diverging commits on main: Git simply slides</text>
      <text xml:space="preserve" text-anchor="start" x="259.22" y="-200.53" font-family="Arial" font-size="14.00" fill="#14263c">      the </text>
      <text xml:space="preserve" text-anchor="start" x="304.22" y="-200.53" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">main</text>
      <text xml:space="preserve" text-anchor="start" x="336.47" y="-200.53" font-family="Arial" font-size="14.00" fill="#14263c"> pointer (and </text>
      <text xml:space="preserve" text-anchor="start" x="415.97" y="-200.53" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">HEAD</text>
      <text xml:space="preserve" text-anchor="start" x="454.22" y="-200.53" font-family="Arial" font-size="14.00" fill="#14263c">) forward to </text>
      <text xml:space="preserve" text-anchor="start" x="526.22" y="-200.53" font-family="Arial" font-weight="bold" font-size="14.00" fill="#14263c">C2</text>
      <text xml:space="preserve" text-anchor="start" x="543.47" y="-200.53" font-family="Arial" font-size="14.00" fill="#14263c"> — no extra commit.</text>
      <text xml:space="preserve" text-anchor="start" x="666.47" y="-200.53" font-family="Arial" font-size="15.50" fill="#14263c">    </text>
    </g>
