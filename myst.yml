version: 1
project:
  id: icg-phd-python-2026
  title: Python for ICG Research
  description: Three practical sessions on scientific Python, reproducible code, Git and coding agents.
  github: xangma/jupyter_data_languages
  license: MIT
  jupyter:
    server:
      url: https://icg-cpd-cluster.port.ac.uk/jupyterhub/services/phd-python-thebe/server/
      token: cpd-hub-oauth
    kernelName: python-phd
    disableSessionSaving: true
  settings:
    output_matplotlib_strings: remove
  toc:
    - file: book/index.md
    - file: book/setup.md
    - file: _executed/00-primer.ipynb
    - file: _executed/01-catalogue.ipynb
    - file: _executed/02-git-and-tests.ipynb
    - file: _executed/03-agents-and-inference.ipynb
    - file: book/agent-tools.md
    - file: _executed/04-signal-extension.ipynb
    - file: book/solutions.md
    - file: book/further-reading.md
    - file: book/instructor.md
site:
  # Book theme v1.4.1: keep the tested CPD/Thebe integration on an immutable build.
  template: https://github.com/myst-templates/book-theme/archive/23f2df5493e23dfb1d9433c8aa64c87beb4232a3.zip
  actions:
    - title: JupyterHub
      url: /jupyterhub/services/phd-python-thebe/bootstrap
